name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest==8.3.4 flake8==7.1.1 black==24.10.0 \
            pytest-cov==6.0.0 pip-audit==2.7.3

      - name: Check dependency consistency
        run: python -m pip check

      # pip-audit exits non-zero whenever advisories are found; --strict only governs
      # dependency-collection failures, so omitting it does NOT make this report-only.
      # continue-on-error is what keeps the step non-blocking. See README.md
      # "Dependency advisories" for the outstanding set and why it is not yet cleared.
      - name: Audit dependencies for known vulnerabilities
        run: python -m pip_audit --requirement requirements.txt --progress-spinner off
        continue-on-error: true

      - name: Check formatting (black)
        run: python -m black --check streamlit_app.py src tests scripts

      - name: Lint (flake8)
        run: python -m flake8 streamlit_app.py src tests scripts

      # Bare --cov uses [tool.coverage.run] source in pyproject.toml, which keeps files
      # that were never executed in the denominator. Naming modules here instead would
      # let an unimported streamlit_app.py drop out of the report silently.
      # Raise the floor as coverage improves; never lower it to make a red build pass.
      - name: Run tests (pytest)
        run: python -m pytest --cov --cov-report=term-missing --cov-fail-under=70

  container-build:
    name: Build non-root container
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Build image
        run: docker build --tag ai-soc-assistant:ci .

      - name: Confirm non-root runtime user
        run: test "$(docker image inspect --format '{{.Config.User}}' ai-soc-assistant:ci)" = "app"
