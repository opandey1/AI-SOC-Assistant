[theme]
base = "dark"
primaryColor = "#7C6CF6"
backgroundColor = "#0A0D13"
secondaryBackgroundColor = "#10141C"
textColor = "#E8ECF3"
linkColor = "#9B8DF9"
codeTextColor = "#22D3EE"
codeBackgroundColor = "#0D1117"
borderColor = "#2E3746"
redColor = "#F0453A"
orangeColor = "#F59E0B"
yellowColor = "#F59E0B"
greenColor = "#10B981"
blueColor = "#22D3EE"
violetColor = "#7C6CF6"
grayColor = "#9BA6B8"
chartCategoricalColors = ["#7C6CF6", "#F0453A", "#F59E0B", "#22D3EE", "#10B981", "#EC4899"]
dataframeBorderColor = "#232A36"
dataframeHeaderBackgroundColor = "#171C26"
font = "Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
codeFont = "'JetBrains Mono', 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace"
baseFontSize = 14
headingFontSizes = ["28px", "22px", "17px", "15px", "14px", "13px"]
headingFontWeights = [600, 600, 600, 600, 600, 600]
baseRadius = "8px"
buttonRadius = "8px"
showWidgetBorder = true
showSidebarBorder = true
linkUnderline = false

[theme.sidebar]
backgroundColor = "#10141C"
secondaryBackgroundColor = "#171C26"
textColor = "#E8ECF3"
borderColor = "#232A36"
primaryColor = "#7C6CF6"
