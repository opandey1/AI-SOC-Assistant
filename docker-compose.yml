# Two-container stack: the SOC pipeline plus a local Ollama LLM server.
#
# First-time setup (pull the model into the persistent Ollama volume):
#   docker compose up -d ollama
#   docker compose exec ollama ollama pull mistral
#
# Generate a ticket with the local model (raw telemetry never leaves the host):
#   docker compose run --rm soc-assistant
#
# Or run the offline template path (no model needed):
#   docker compose run --rm soc-assistant python src/pipeline.py --no-llm

services:
  ollama:
    image: ollama/ollama:latest
    container_name: soc-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama-models:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 5

  soc-assistant:
    build: .
    container_name: soc-assistant
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      SOC_LLM_PROVIDER: ollama
      SOC_OLLAMA_MODEL: mistral
      OLLAMA_BASE_URL: http://ollama:11434
    volumes:
      - ./data:/app/data
    # Override the image default (--no-llm) to route through the Ollama model.
    command: ["python", "src/pipeline.py"]

volumes:
  ollama-models:
