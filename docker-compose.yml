# Default: deterministic template mode with networking disabled.
#   docker compose run --rm soc-assistant
#
# Optional local-LLM profile:
#   docker compose --profile local-llm up -d ollama
#   docker compose --profile local-llm exec ollama ollama pull mistral
#   docker compose --profile local-llm run --rm soc-assistant-ollama
#
# Analyst dashboard:
#   docker compose --profile dashboard up dashboard
#
# Kafka-compatible live replay:
#   docker compose --profile streaming up

services:
  soc-assistant:
    build: .
    container_name: soc-assistant
    environment:
      SOC_ENABLE_THREAT_INTEL: "false"
    volumes:
      - ./data:/app/data:ro
      - soc-state:/app/state
    network_mode: none
    command: ["python", "-m", "src.pipeline", "--no-llm"]

  ollama:
    image: ollama/ollama:0.32.5
    profiles: ["local-llm"]
    ports:
      # Keep the local model API off external interfaces.
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama-models:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 12

  soc-assistant-ollama:
    build: .
    profiles: ["local-llm"]
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      SOC_LLM_PROVIDER: ollama
      SOC_OLLAMA_MODEL: mistral
      OLLAMA_BASE_URL: http://ollama:11434
      # Threat-intelligence APIs remain opt-in even with a local model.
      SOC_ENABLE_THREAT_INTEL: "false"
    volumes:
      - ./data:/app/data:ro
      - soc-state:/app/state
      - soc-models:/app/models
    command: ["python", "-m", "src.pipeline", "--provider", "ollama"]

  dashboard:
    build: .
    profiles: ["dashboard"]
    ports:
      - "127.0.0.1:8501:8501"
    volumes:
      - ./data:/app/data:ro
      - soc-state:/app/state
      - soc-models:/app/models
    command:
      [
        "streamlit",
        "run",
        "streamlit_app.py",
        "--server.address=0.0.0.0",
        "--server.port=8501",
      ]

  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v26.2.1
    profiles: ["streaming"]
    command:
      - redpanda
      - start
      - --kafka-addr
      - internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr
      - internal://redpanda:9092,external://localhost:19092
      - --rpc-addr
      - redpanda:33145
      - --advertise-rpc-addr
      - redpanda:33145
      - --mode
      - dev-container
      - --smp
      - "1"
      - --default-log-level=info
    ports:
      - "127.0.0.1:19092:19092"
    volumes:
      - redpanda-data:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD", "rpk", "cluster", "health", "--brokers=localhost:9092"]
      interval: 5s
      timeout: 5s
      retries: 20

  soc-stream-consumer:
    build: .
    profiles: ["streaming"]
    depends_on:
      redpanda:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP_SERVERS: redpanda:9092
      SOC_ENABLE_THREAT_INTEL: "false"
    volumes:
      - ./data:/app/data:ro
      - soc-state:/app/state
      - soc-models:/app/models
    command:
      [
        "python",
        "-m",
        "src.streaming",
        "consume",
        "--bootstrap-servers",
        "redpanda:9092",
        "--idle-timeout",
        "60",
      ]

  soc-stream-publisher:
    build: .
    profiles: ["streaming"]
    depends_on:
      redpanda:
        condition: service_healthy
    volumes:
      - ./data:/app/data:ro
    command:
      [
        "python",
        "-m",
        "src.streaming",
        "publish",
        "--bootstrap-servers",
        "redpanda:9092",
        "--limit",
        "25",
        "--delay",
        "0.5",
      ]

volumes:
  ollama-models:
  redpanda-data:
  soc-models:
  soc-state:
