name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest==8.3.4 flake8==7.1.1 black==24.10.0 \
            pytest-cov==6.0.0 pip-audit==2.7.3

      - name: Check dependency consistency
        run: python -m pip check

      # Advisories were previously caught by hand during review. Non-blocking for now:
      # a new advisory in a transitive dependency should surface, not stop the build.
      - name: Audit dependencies for known vulnerabilities
        run: python -m pip_audit --requirement requirements.txt --strict --progress-spinner off
        continue-on-error: true

      - name: Check formatting (black)
        run: python -m black --check streamlit_app.py src tests scripts

      - name: Lint (flake8)
        run: python -m flake8 streamlit_app.py src tests scripts

      # --cov-fail-under guards the floor. Raise it as coverage improves; never lower it
      # to make a red build pass.
      - name: Run tests (pytest)
        run: python -m pytest --cov=src --cov=streamlit_app --cov-report=term-missing --cov-fail-under=70

  container-build:
    name: Build non-root container
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Build image
        run: docker build --tag ai-soc-assistant:ci .

      - name: Confirm non-root runtime user
        run: test "$(docker image inspect --format '{{.Config.User}}' ai-soc-assistant:ci)" = "app"
